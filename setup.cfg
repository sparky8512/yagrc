[metadata]
name = yagrc
url = https://github.com/sparky8512/yagrc
author_email = sparky8512-py@yahoo.com
license = Apache-2.0
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Topic :: Software Development :: Libraries :: Python Modules
description = Yet another gRPC reflection client
long_description = file: README.md
long_description_content_type = text/markdown

[options]
install_requires =
    grpcio>=1.12.0
    grpcio_reflection>=1.7.3
    protobuf>=4.22.0
packages =
    yagrc
    yagrc.grpc_reflection.v1
package_dir =
    =src
python_requires = >=3.7

[options.extras_require]
test = pytest; pytest-grpc; grpcio==1.63.2; grpcio-reflection==1.63.2; protobuf==5.26.1

[yapf]
based_on_style = google
